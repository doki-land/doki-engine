{% extends "layout.html" %}

{% block title %}{% page.title %} - {% site.title %}{% end block %}

{% block content %}
<article class="page">
  <header>
    <h1>{% page.title %}</h1>
    {% if page.date %}
    <time datetime="{% page.date |> date: '%Y-%m-%d' %}">{% page.date |> date: '%Y-%m-%d' %}</time>
    {% end if %}
  </header>

  <div class="content">
    {% content |> raw %}
  </div>
</article>
{% end block %}
