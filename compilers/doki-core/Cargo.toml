[package]
name = "doki-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Doki build core: config, content graph, BuildSession, Dejavu public render (no OXC, no Node)"
publish = false

[dependencies]
dejavu = { workspace = true }
figment = { workspace = true }
hex = { workspace = true }
miette = { workspace = true }
notedown-formats = { workspace = true, features = ["markdown"] }
notedown-ir = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
tempfile = "3"
