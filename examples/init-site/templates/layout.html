<!DOCTYPE html>
<html lang="{% site.lang %}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% site.title %}</title>
</head>
<body>
  <header>
    <h1>{% site.title %}</h1>
  </header>
  <main>
    {% block content %}{% end block %}
  </main>
  <footer>
    <p>&copy; {% now |> date: '%Y' %} {% site.author %}</p>
  </footer>
</body>
</html>
