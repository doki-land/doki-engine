packages:
  - 'compilers/*'
  - 'runtimes/doki'
  - 'runtimes/plugins/*'
  - 'runtimes/themes/*'
  - 'runtimes/editors/*'
  - 'examples/*'
  - '!runtimes/plugins/doki-plugin-template'
  - '!runtimes/themes/doki-theme-template'
allowBuilds:
  '@parcel/watcher': set this to true or false
  '@vscode/vsce-sign': set this to true or false
  esbuild: set this to true or false
  keytar: set this to true or false
