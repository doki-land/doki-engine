# Pack portable doki zip and publish/update a GitHub Release for the tag.
# Independent of release-npm / release-docker.
#
# Checkout is this repo only (branch `dev`). Do not clone dejavu-language or any sibling.

name: release-artifacts

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-artifacts-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Resolve version from tag
        id: ver
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "Tag must be vX.Y.Z (got: $GITHUB_REF_NAME)" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          echo "zip=doki-v${VERSION}-linux-x64.zip" >> "$GITHUB_OUTPUT"

      - name: Install & pack zip
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          node scripts/set-release-version.mjs "${{ steps.ver.outputs.version }}"
          node scripts/prepare-npm-publish.mjs
          mkdir -p dist-artifacts
          node scripts/pack-doki-portable.mjs \
            --out portable \
            --zip "dist-artifacts/${{ steps.ver.outputs.zip }}"

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          # Re-running on the same tag updates assets — not an error.
          files: |
            dist-artifacts/${{ steps.ver.outputs.zip }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
