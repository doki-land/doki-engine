# Pack portable doki zip and publish/update a GitHub Release for the tag.
# Independent of release-npm / release-docker.
#
# Checkout is this repo only (branch `dev`). Do not clone dejavu-language or any sibling.

name: release-artifacts

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-artifacts-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  # ------------------------------------------------------------------
  # CI 门控：类型检查 + 测试 + 打包 smoke
  # ------------------------------------------------------------------
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Type check
        run: pnpm run check

      - name: Tests
        run: pnpm run test:ts

      - name: Build smoke
        run: pnpm run build

  # ------------------------------------------------------------------
  # Release artifacts（CI 绿了才跑）
  # ------------------------------------------------------------------
  artifacts:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Resolve version from tag
        id: ver
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "Tag must be vX.Y.Z (got: $GITHUB_REF_NAME)" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          echo "zip=doki-v${VERSION}-linux-x64.zip" >> "$GITHUB_OUTPUT"

      - name: Install & pack zip
        run: |
          set -euo pipefail
          pnpm install --no-frozen-lockfile
          node scripts/set-release-version.mjs "${{ steps.ver.outputs.version }}"
          node scripts/prepare-npm-publish.mjs
          mkdir -p dist-artifacts
          node scripts/pack-doki-portable.mjs \
            --out portable \
            --zip "dist-artifacts/${{ steps.ver.outputs.zip }}"

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          # Re-running on the same tag updates assets — not an error.
          files: |
            dist-artifacts/${{ steps.ver.outputs.zip }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------------------------------
      # 可信发布：GitHub OIDC → SLSA v1 build provenance
      # ------------------------------------------------------------------
      - name: Generate SLSA provenance attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: dist-artifacts/${{ steps.ver.outputs.zip }}
