[workspace]
resolver = "2"
members = ["compilers/doki-core", "compilers/doki-node"]
default-members = ["compilers/doki-core", "compilers/doki-node"]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/doki-land/doki-engine"

[workspace.dependencies]
figment = { version = "0.10", features = ["toml", "env"] }
miette = { version = "7", features = ["fancy"] }
napi = { version = "3", default-features = false, features = ["napi6", "serde-json"] }
napi-derive = "3"
napi-build = "2"
parking_lot = "0.12"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2"
toml = "0.8"
hex = "0.4"
dejavu = { path = "../dejavu-language/projects/dejavu.rs/crates/dejavu" }
