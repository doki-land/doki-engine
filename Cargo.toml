[workspace]
resolver = "2"
members = ["compilers/doki-napi"]
default-members = ["compilers/doki-napi"]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/doki-land/doki-engine"

[workspace.dependencies]
figment = { version = "0.10", features = ["toml", "env"] }
miette = { version = "7", features = ["fancy"] }
napi = { version = "3", default-features = false, features = ["napi6", "serde-json"] }
napi-derive = "3"
napi-build = "2"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2"
toml = "0.8"
hex = "0.4"
dejavu = { path = "../dejavu-language/projects/dejavu.rs/crates/dejavu" }
dejavu-ir = { path = "../dejavu-language/projects/dejavu.rs/crates/dejavu-ir" }
# Shared template contract + dejavu input engine + framework contract from `document.rs`.
template = { git = "https://github.com/notedge/document.rs", rev = "f4217bf76831d61430800f7133142fe53ccfc456" }
template-framework = { git = "https://github.com/notedge/document.rs", rev = "f4217bf76831d61430800f7133142fe53ccfc456" }
template-input-dejavu = { git = "https://github.com/notedge/document.rs", rev = "f4217bf76831d61430800f7133142fe53ccfc456" }
notedown-formats = { git = "https://github.com/notedge/notedown.git", rev = "3c01bea86d5824771ff12e26dd50494f0199c0e7", default-features = false }
notedown-ir = { git = "https://github.com/notedge/notedown.git", rev = "3c01bea86d5824771ff12e26dd50494f0199c0e7" }
